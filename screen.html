<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuteness Casino — Proyección</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#ff39b9;font-family:Arial,Helvetica,sans-serif;font-weight:800;overflow:hidden}main{height:100dvh;width:100vw;display:grid;place-items:center;text-align:center;padding:5vh 6vw}h1{font-size:clamp(40px,8vw,150px);letter-spacing:-.06em;line-height:1;margin:.1em 0}p{font-size:clamp(20px,3vw,56px);margin:.6em 0}small{font-size:clamp(16px,2vw,35px);letter-spacing:.08em}#qr{width:min(42vh,35vw);height:auto;margin:3vh auto;display:block}.ranking{width:min(1100px,90vw);align-self:start}.clock{font-size:clamp(80px,17vh,200px);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.07em;margin:0 0 2vh}.rankrow{display:grid;grid-template-columns:12% 1fr 35%;gap:12px;text-align:left;border-bottom:1px solid #ff39b933;font-size:clamp(18px,4.1vh,50px);padding:.28em 0;font-variant-numeric:tabular-nums}.rankrow span:last-child{text-align:right}.speech{max-width:90vw;font-size:clamp(32px,5.4vw,100px);line-height:1.15;letter-spacing:-.04em;overflow-wrap:anywhere}video{position:fixed;inset:0;width:100vw;height:100dvh;object-fit:contain;background:black}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-25px;width:10px;height:18px;background:var(--c,#ff39b9);left:var(--x);animation:fall var(--dur) linear var(--delay) both}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(850deg)}}@media(prefers-reduced-motion:reduce){.confetti{display:none}}.speech-progress{position:fixed;bottom:3vh;left:50%;transform:translateX(-50%);width:24vw;display:grid;gap:8px;text-align:center;pointer-events:none}.speech-count{font:400 12px Arial,Helvetica,sans-serif;letter-spacing:.06em;color:#654058;font-variant-numeric:tabular-nums}.speech-track{height:2px;background:#20141c;overflow:hidden;border-radius:2px}.speech-fill{height:100%;background:#824065;border-radius:2px}.acting{font-size:clamp(16px,2.3vw,38px);color:#bd759f;font-style:italic;margin-bottom:3vh}.acting small{display:block;font-size:.55em;margin-bottom:1vh}</style><audio id="music" src="assets/game-music.mp3" loop preload="auto"></audio><main id="stage"></main><script>
let cues={},lines=[],key='',state={},offset=0;const stage=document.getElementById('stage'),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);fetch('/speech.json').then(r=>r.json()).then(v=>{lines=v;key=''});fetch('/speech-cues.json').then(r=>r.json()).then(v=>{cues=v;key=''});const music=document.getElementById('music');let restart=-1;function syncMusic(){let a=state.audio||{};music.volume=(a.volume??40)/100;music.muted=!!a.muted;if(restart!==a.restart){restart=a.restart;music.currentTime=0}if(state.phase==='running'&&!a.paused){if(music.paused)music.play().catch(()=>{})}else music.pause()}document.addEventListener('click',()=>{syncMusic();stage.querySelector('video')?.play().catch(()=>{})});function node(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function clock(){let t=Math.max(0,Math.ceil((state.endAt-Date.now()-offset)/1000));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}function confetti(){let d=node('div','','confetti');for(let i=0;i<130;i++){let a=node('i','');a.style.cssText=`--c:${['#ff39b9','#ffe22b','#ffffff','#9f73ff','#00e6c0','#ff694a'][i%6]};--x:${Math.random()*100}%;--dur:${3+Math.random()*4}s;--delay:${Math.random()*1.7}s;--drift:${Math.random()*240-120}px;opacity:${.4+Math.random()*.6}`;d.append(a)}document.body.append(d);setTimeout(()=>d.remove(),9000)}function render(){let k=JSON.stringify([state.cue,state.cue==='ranking'?state.rows?.map(x=>[x.playerId,x.netProfit]):null,state.cue==='speech'?state.line:null,state.cue==='intro'?state.video:state.cue==='outro'?state.outro:null,state.cue==='qr'?state.playerUrl:null,state.session]);if(k===key){let c=document.querySelector('.clock');if(c)c.textContent=clock();return}let prev=stage.dataset.cue;key=k;stage.dataset.cue=state.cue;stage.replaceChildren();let w=node('div','');stage.append(w);let add=(t,s,c)=>w.append(node(t,s,c));switch(state.cue){case'intro':if(state.video){let v=node('video','');v.src=state.video;v.autoplay=true;v.playsInline=true;w.append(v);v.play().catch(()=>{v.controls=true})}else add('h1','CUTENESS CASINO');break;case'qr':add('h1','CUTENESS CASINO');let qr=node('img','');qr.id='qr';let url=state.playerUrl;qr.src='/api/qr?url='+encodeURIComponent(url);qr.onerror=()=>{qr.replaceWith(node('p','No se ha podido cargar el QR. Utilizad la dirección indicada.'))};w.append(qr);add('p','Escanead el código QR para participar.');add('small',url);break;case'lobby':add('h1','BIENVENIDOS AL CASINO');add('p','El juego comenzará en breve.');break;case'ranking':w.className='ranking';add('small','TIEMPO RESTANTE');add('div',clock(),'clock');add('small','CLASIFICACIÓN EN DIRECTO');(state.rows||[]).slice(0,8).forEach((r,i)=>{let row=node('div','','rankrow');[String(i+1).padStart(2,'0'),'JUGADOR '+r.playerId,money(r.netProfit)].forEach(v=>row.append(node('span',v)));w.append(row)});break;case'end':add('h1','¡SE ACABÓ EL TIEMPO!');break;case'winner':{let r=state.rows?.[0];add('small','¡TENEMOS GANADOR!');add('h1',r?'JUGADOR '+r.playerId:'SIN PARTICIPANTES');if(r)add('p',money(r.netProfit)+' de beneficio neto');if(prev!=='winner')confetti();break}case'outro':{let v=node('video','');v.src=state.outro;v.autoplay=true;v.playsInline=true;v.onerror=()=>{w.replaceChildren(node('p','Vídeo final no disponible.'));};w.append(v);v.play().catch(()=>{v.controls=true});break}case'speech':{if(cues[state.line]){let c=node('div','','acting');c.append(node('small','INDICACIÓN ACTORAL · NO LEER EN VOZ ALTA'),node('div',cues[state.line]));w.append(c)}add('div',lines[state.line]||'','speech');if(lines.length){let current=Math.max(1,Math.min(lines.length,Number(state.line)+1));let progress=node('div','','speech-progress'),count=node('div',String(current).padStart(2,'0')+' / '+lines.length,'speech-count'),track=node('div','','speech-track'),fill=node('div','','speech-fill');fill.style.width=(100*current/lines.length)+'%';track.append(fill);progress.append(count,track);w.append(progress)}break;}case'archive':add('h1','DETRÁS DE LA TERNURA');add('p','Explorad nuestro archivo de investigación en vuestros móviles.');break}if(state.cue!=='winner')document.querySelector('.confetti')?.remove()}async function poll(){try{let r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let v=await r.json();if(v.state.version!=='9')throw Error('Servidor incorrecto');state=v.state;offset=state.now-Date.now();syncMusic();render()}catch(e){key='';stage.replaceChildren(node('p','Sin conexión con el servidor.'));console.warn(e)}setTimeout(poll,350)}poll();document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen().catch(()=>{})});</script></html>
