<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cuteness Casino</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21130e;font-family:Arial,sans-serif}#view{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;touch-action:pan-x}#view::-webkit-scrollbar{display:none}#scene{position:relative;height:100%;width:max(177.6939dvh,100vw);min-width:100vw;background:url(assets/lobby-panorama.jpg) center/100% 100% no-repeat} .spot{position:absolute;transform:translate(-50%,-50%);width:9vh;height:10vh;border:0;background:transparent;cursor:pointer;z-index:2}.bubble{position:absolute;z-index:3;background:rgba(255,255,255,.73);color:#171717;font-size:clamp(10px,1.55vh,15px);line-height:1.2;padding:5px 7px;width:14vh;max-width:150px;pointer-events:none;opacity:0;transition:opacity .25s}.bubble.on{opacity:1}#hint{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:white;text-shadow:0 1px 5px #000;font-size:25px;pointer-events:none;transition:opacity .5s}</style></head><body><div id="view"><div id="scene"></div></div><div id="hint">← &nbsp; →</div><script>const points=[[49, 68, "Hi, human! Welcome to Cuteness Casino! The game will start shortly. Feel free to look around!"], [9, 33, "Just one more pull. I'm sure my next video will go viral!"], [31, 29, "I used to sleep 16 hours a day. Now I'm a full-time content creator."], [22, 43, "Feeling lucky today? Cuteness is always a good investment!"], [35, 57, "Do you think I'm cute enough to make a million?"], [73, 33, "Breathe in. Breathe out. Don't forget to like and subscribe."], [81, 47, "I'm not stretching. I'm creating wellness content."], [93, 43, "Inner peace is important. But engagement is more important."], [78, 60, "A little bit of sadness, a little bit of drama, and everyone loves you!"], [76, 79, "My last video got two million views. Nobody even asked if I was real."], [64, 73, "Whatever makes you happy, human. That's what I'm here for."], [81, 25, "Everyone is welcome here. Real, fake, or somewhere in between."], [9, 55, "I get paid in treats. My owner gets paid in euros."], [27, 68, "Shhh. I am studying the algorithm."], [96, 68, "Being adorable is a full-time job."]],view=document.querySelector('#view'),scene=document.querySelector('#scene'),hint=document.querySelector('#hint');let active=0,manualUntil=0,last=0,down=false,start=0,scroll=0,moved=false;const anchors=[[52,59],[12,25],[34,20],[25,37],[38,49],[64,28],[84,36],[87,28],[81,51],[76,70],[56,65],[83,17],[13,48],[30,62],[86,61]];const bubbles=[];points.forEach(([x,y,t],i)=>{let b=document.createElement('button');b.className='spot';b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label',t);b.onclick=()=>{if(!moved){manualUntil=Date.now()+3000;show(i)}};scene.append(b);let q=document.createElement('div');q.className='bubble';q.textContent=t;q.style.left=anchors[i][0]+'%';q.style.top=anchors[i][1]+'%';scene.append(q);bubbles.push(q)});function show(i){active=i;bubbles.forEach((b,j)=>b.classList.toggle('on',i===j))}function update(){if(Date.now()<manualUntil)return;let center=view.scrollLeft+view.clientWidth/2;let candidates=points.map((p,i)=>({i,d:Math.abs(p[0]*scene.clientWidth/100-center)})).sort((a,b)=>a.d-b.d);show(candidates[0].i)}function init(){view.scrollLeft=(scene.clientWidth-view.clientWidth)/2;manualUntil=Date.now()+2500;show(0)}view.addEventListener('scroll',()=>{hint.style.opacity='0';manualUntil=0;update()},{passive:true});view.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;start=e.clientX;scroll=view.scrollLeft});window.addEventListener('pointermove',e=>{if(!down)return;if(Math.abs(e.clientX-start)>5)moved=true;if(moved)view.scrollLeft=scroll+start-e.clientX});window.addEventListener('pointerup',()=>{down=false;setTimeout(()=>moved=false,0)});view.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){view.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});window.addEventListener('resize',()=>show(active));requestAnimationFrame(()=>{init();setTimeout(()=>{manualUntil=Date.now()+2500;show(0)},100)});</script></body></html>
