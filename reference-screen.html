<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUTENESS CASINO / Pantalla</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f7eff7;font-family:Arial,Helvetica,sans-serif}main{height:100dvh;display:grid;place-items:center;text-align:center;padding:5vh 7vw;overflow:hidden}h1{font-size:clamp(36px,8vw,150px);line-height:1;letter-spacing:-.045em;margin:0;color:#ff32aa;font-weight:900}p{font-size:clamp(20px,3vw,55px);margin:1.2rem 0 0}small{font:clamp(14px,1.5vw,28px) monospace;color:#ff79cc;letter-spacing:.1em}#clock{font:bold clamp(50px,9vh,130px)/1 monospace;letter-spacing:-.06em;color:#ff32aa}.ranking{width:min(1100px,90vw);height:100%;display:flex;flex-direction:column;justify-content:center;gap:1.5vh}.rankrow{display:grid;grid-template-columns:1fr 3fr 2fr;align-items:center;text-align:left;font:bold clamp(18px,3.6vh,48px)/1.15 monospace;padding:1.05vh 0;border-bottom:1px solid #30212d}.rankrow span:last-child{text-align:right}.rankrow:first-child{color:#ff32aa}.speech{font-size:clamp(30px,5.3vw,100px);font-weight:700;line-height:1.15;max-width:90vw;letter-spacing:-.035em}.speech.em{color:#ff32aa}.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}.confetti-piece{position:absolute;top:-25px;width:9px;height:16px;animation:fall var(--duration) linear var(--delay) both;left:var(--x);background:var(--c)}@keyframes fall{to{transform:translate(var(--drift),110dvh) rotate(850deg)}}@media(prefers-reduced-motion:reduce){.confetti-layer{display:none}}body.projection{cursor:none}button,input,textarea{font:inherit;color:inherit;background:#171119;border:1px solid #693052;border-radius:7px;padding:10px}button{cursor:pointer}button.active{background:#ff32aa;color:#000}#console{max-width:900px;margin:auto;padding:25px}#console h1{font-size:36px}#console p{font-size:16px}section{border:1px solid #49263d;padding:15px;margin:15px 0}.buttons{display:flex;flex-wrap:wrap;gap:8px}label{display:block;margin:10px 0}input,textarea{width:100%}video{width:100vw;height:100dvh;object-fit:contain}img{width:min(22vh,220px);display:block;margin:2vh auto}[hidden]{display:none!important}</style><body><main id="stage"></main><div id="console" hidden><h1>CONTROL PRIVADO</h1><p id="status"></p><button id="open">Abrir proyección</button><section class="buttons" id="cues"></section><section><button id="mode">Discurso automático / manual</button> <button id="prev">Frase anterior</button> <button id="next">Frase siguiente</button><p id="line"></p></section><section><label>Imagen QR (URL)<input id="qr"></label><label>Vídeo de Angela (URL)<input id="video"></label><label>Clasificación manual (JSON: playerId, netProfit)<textarea id="rows" rows="5" placeholder='[{"playerId":"007","netProfit":4948}]'></textarea></label><button id="apply">Aplicar datos</button><button id="demo">Activar simulación</button></section><p>Flechas: escenas / frases. F: pantalla completa. B: negro. C: control. R: reiniciar. M: modo de discurso. Espacio: siguiente escena (también durante el discurso).</p></div><script>
const lines=["¡Hola a todo el mundo!", "Antes de nada, muchísimas gracias.", "De verdad que no esperaba ganar hoy.", "Empecé a hacer vídeos de animales con IA hace unos tres meses.", "Por aquel entonces, vi a gente compartiendo tutoriales en internet sobre cómo ganaban dinero con vídeos generados por IA.", "Algunas personas decían ganar cientos de euros al día.", "Y pensé: ¿por qué no probar?", "La verdad es que mi sueldo no me llegaba.", "El alquiler, la comida, las facturas… todo era cada vez más caro.", "No pretendía hacerme rico.", "Solo quería ganar un poco de dinero extra.", "Así que, después del trabajo, en vez de ver Netflix o salir con mis amigos, empecé a aprender a generar vídeos.", "Cada noche veía tutoriales, probaba distintos modelos de IA y seguía girando la ruleta para conseguir mejores resultados.", "Al principio era muy frustrante.", "A veces los gatos tenían seis patas.", "A veces sus caras cambiaban a mitad del vídeo.", "A veces gastaba todas mis fichas y aun así no conseguía nada aprovechable.", "Pero no me rendí.", "Empecé a estudiar qué vídeos se hacían virales.", "Aprendí que los animales adorables no bastaban.", "Hacía falta una historia.", "Hacían falta emociones.", "Algo que hiciera que la gente dejara de deslizar la pantalla.", "Un gatito llorando.", "Un gato bailando.", "Un mono que va a trabajar.", "Probé distintos personajes, músicas y estímulos emocionales.", "Y poco a poco empecé a entender el algoritmo.", "Mi primer vídeo apenas tuvo visualizaciones.", "Pero un día, uno de mis vídeos despegó de repente.", "No me lo podía creer.", "Actualizaba la página sin parar, viendo cómo subían las cifras.", "Y entonces me di cuenta de algo:", "Incluso mientras dormía, mis animales seguían trabajando para mí.", "Ahora hago vídeos todos los días.", "A veces diez, a veces veinte.", "He aprendido a hacerlos más rápido y por menos dinero.", "Y hoy… ¡estoy en el número uno!", "Solo quiero decirles a todas las personas aquí presentes: si yo puedo hacerlo, vosotros también podéis.", "No necesitáis equipos caros.", "No necesitáis ser artistas.", "Ni siquiera necesitáis un animal real.", "Solo tenéis que seguir intentándolo, seguir aprendiendo y seguir generando.", "No os detengáis tras vuestro primer fracaso.", "Vuestro próximo vídeo podría ser el que os cambie la vida.", "¡Muchísimas gracias!", "Y recordad:", "¡DEJAD QUE LOS ANIMALES TRABAJEN PARA VOSOTROS!"];const $=id=>document.getElementById(id),control=new URLSearchParams(location.search).has('control'),stage=$('stage'),bus=new BroadcastChannel('cc-pantalla-ranking-v3');const sequence=['black','lobby','angela','phone','rules','ranking','end','winner','speech','archive'];const labels=['Negro','Entrada','Angela','Móviles','Reglas','Clasificación / iniciar','Fin','Ganador','Discurso','Archivo'];const initial=()=>({cue:'black',end:0,finished:false,rows:Array.from({length:20},(_,i)=>({playerId:String(i+1).padStart(3,'0'),netProfit:0})),demo:true,step:0,line:0,auto:true,qr:'',video:''});let state=initial(),lastKey='',speechKey='',speechGeneration=0,lastDemo=0;const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);const sorted=()=>[...state.rows].sort((a,b)=>b.netProfit-a.netProfit||a.playerId.localeCompare(b.playerId));function time(){let s=state.end?Math.max(0,Math.ceil((state.end-Date.now())/1000)):state.finished?0:420;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function send(){bus.postMessage({type:'state',state});render()}function select(c){if(c==='ranking'&&!state.end&&!state.finished)state.end=Date.now()+420000;if(c==='end'||c==='winner'||c==='speech'){state.finished=true;state.end=0}if(c==='speech'&&state.cue!=='speech')state.line=0;state.cue=c;send()}function step(d){select(sequence[Math.max(0,Math.min(sequence.length-1,sequence.indexOf(state.cue)+d))])}function phrase(d){if(state.cue!=='speech')return;let n=state.line+d;if(n>=lines.length){select('archive');return}state.line=Math.max(0,n);send()}function toggle(){state.auto=!state.auto;send()}function el(tag,t){let e=document.createElement(tag);e.textContent=t;return e}function confetti(){document.querySelector('.confetti-layer')?.remove();let l=document.createElement('div');l.className='confetti-layer';for(let i=0;i<110;i++){let p=document.createElement('i');p.className='confetti-piece';p.style.cssText=`--x:${Math.random()*100}%;--c:${['#ff39b9','#ffe22b','#fff','#9f73ff','#00e6c0'][i%5]};--duration:${3+Math.random()*4}s;--delay:${Math.random()*2}s;--drift:${Math.random()*180-90}px`;l.append(p)}document.body.append(l);setTimeout(()=>l.remove(),9500)}
function speak(){let k=state.cue==='speech'?state.line+':'+state.auto:'';if(k===speechKey)return;speechKey=k;let g=++speechGeneration;if(!window.speechSynthesis)return;speechSynthesis.cancel();if(!k||!state.auto)return;let u=new SpeechSynthesisUtterance(lines[state.line]);u.lang='es-ES';u.rate=.98;let v=speechSynthesis.getVoices().find(v=>v.lang==='es-ES');if(v)u.voice=v;u.onend=()=>{if(g!==speechGeneration||state.cue!=='speech'||!state.auto)return;if(state.line<lines.length-1)phrase(1);else{state.auto=false;send()}};u.onerror=()=>{if(g===speechGeneration&&state.cue==='speech'){state.auto=false;send()}};speechSynthesis.speak(u)}
function render(){if(control){$('status').textContent=state.cue+' / '+time()+' / '+(state.demo?'SIMULACIÓN':'DATOS EXTERNOS');$('line').textContent=(state.auto?'Automático':'Manual')+' · '+(state.line+1)+'/'+lines.length+' · '+lines[state.line];document.querySelectorAll('[data-cue]').forEach(b=>b.classList.toggle('active',b.dataset.cue===state.cue));return}let key=JSON.stringify([state.cue,state.cue==='ranking'?sorted():null,state.cue==='speech'?state.line:null,state.cue==='winner'?sorted()[0]:null,state.qr,state.video]);if(key===lastKey){if($('clock'))$('clock').textContent=time();speak();return}let previous=stage.dataset.cue;stage.dataset.cue=state.cue;lastKey=key;stage.replaceChildren();let w=document.createElement('div');stage.append(w);let add=(t,v)=>w.append(el(t,v));switch(state.cue){case 'lobby':add('h1','CUTENESS CASINO');if(state.qr){let i=document.createElement('img');i.src=state.qr;w.append(i)}add('p','Escanead el código QR para participar.');break;case 'angela':if(state.video){let v=document.createElement('video');v.src=state.video;v.autoplay=true;v.playsInline=true;w.append(v);v.play().catch(()=>{})}else add('h1','¡HOLA, HUMANOS!');break;case 'phone':add('h1','MIRAD VUESTROS MÓVILES');break;case 'rules':add('h1','100 TOKENS. 7 MINUTOS.');add('p','Gana quien consiga el mayor beneficio neto.');break;case 'ranking':w.className='ranking';add('small','TIEMPO RESTANTE');let c=el('div',time());c.id='clock';w.append(c);add('small','CLASIFICACIÓN EN DIRECTO'+(state.demo?' / SIMULACIÓN':''));let list=document.createElement('div');sorted().slice(0,8).forEach((r,i)=>{let row=document.createElement('div');row.className='rankrow';[String(i+1).padStart(2,'0'),'JUGADOR '+r.playerId,money(r.netProfit)].forEach(t=>row.append(el('span',t)));list.append(row)});w.append(list);break;case 'end':add('h1','¡SE ACABÓ EL TIEMPO!');break;case 'winner':{let r=sorted()[0];add('small','¡TENEMOS GANADOR!');add('h1',r?'JUGADOR '+r.playerId:'SIN GANADOR');if(r)add('p',money(r.netProfit)+' de beneficio neto');if(previous!=='winner')confetti();break}case 'speech':{let l=el('div',lines[state.line]);l.className='speech'+(/Incluso mientras dormía|No os detengáis|DEJAD QUE LOS ANIMALES/.test(lines[state.line])?' em':'');w.append(l);break}case 'archive':add('h1','DETRÁS DE LA TERNURA');add('p','Explorad el archivo en vuestros móviles.');break}if(state.cue!=='winner')document.querySelector('.confetti-layer')?.remove();speak()}
function external(data){if(!data||!Array.isArray(data.rows)||state.finished)return;let rows=data.rows.filter(r=>typeof r.playerId==='string'&&Number.isFinite(r.netProfit));if(!rows.length)return;state.rows=rows;state.demo=false;if(Number.isFinite(data.endAt))state.end=data.endAt;send()}window.updateRanking=external;bus.onmessage=e=>{let d=e.data;if(d.type==='state'){state=d.state;render()}else if(d.type==='ranking'&&!control)external(d);else if(d.type==='hello'&&!control)send()};if(control){stage.hidden=true;$('console').hidden=false;sequence.forEach((c,i)=>{let b=el('button',labels[i]);b.dataset.cue=c;b.onclick=()=>select(c);$('cues').append(b)});$('open').onclick=()=>window.open(location.href.split('?')[0],'ccprojection');$('mode').onclick=toggle;$('prev').onclick=()=>phrase(-1);$('next').onclick=()=>phrase(1);$('apply').onclick=()=>{try{if($('rows').value.trim()){let r=JSON.parse($('rows').value);if(!Array.isArray(r)||!r.every(x=>typeof x.playerId==='string'&&Number.isFinite(x.netProfit)))throw Error('JSON no válido');state.rows=r;state.demo=false}state.qr=$('qr').value;state.video=$('video').value;send()}catch(e){alert(e.message)}};$('demo').onclick=()=>{state.demo=true;send()};bus.postMessage({type:'hello'})}else{document.body.classList.add('projection');bus.postMessage({type:'hello'})}
document.addEventListener('keydown',e=>{if(e.repeat||e.target.matches('input,textarea'))return;let k=e.key.toLowerCase();if(['arrowright','arrowleft',' '].includes(k)){e.preventDefault();if(state.cue==='speech'&&k!==' ')phrase(k==='arrowright'?1:-1);else step(k==='arrowleft'?-1:1)}else if(k==='f')document.documentElement.requestFullscreen().catch(()=>{});else if(k==='c')window.open(location.href.split('?')[0]+'?control=1','cccontrol');else if(k==='b')select('black');else if(k==='r'){state=initial();send()}else if(k==='m')toggle()});setInterval(()=>{if(!control){if(state.end&&!state.finished&&Date.now()>=state.end){select('end');return}if(state.demo&&state.end&&!state.finished&&Date.now()-lastDemo>2300){lastDemo=Date.now();state.step++;let i=(state.step*7)%state.rows.length;state.rows[i].netProfit+=((state.step*53)%320)+15;send()}}render()},200);render();</script></body></html>
